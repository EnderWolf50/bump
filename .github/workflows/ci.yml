name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The tool drives Windows package managers and the Windows registry.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
